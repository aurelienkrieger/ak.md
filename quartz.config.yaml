# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Aurélien Krieger
  pageTitleSuffix: ""
  enableSPA: false
  enablePopovers: false
  analytics: null
  locale: en-US
  baseUrl: aurelienkrieger.com
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Inter Regular
      body: Inter Regular
      code: monospace
    colors:
      lightMode:
        light: "#f5f5f5"
        lightgray: "#e8e8e8"
        gray: "#a0a0a0"
        darkgray: "#141414"
        dark: "#141414"
        secondary: "#d7691e"
        tertiary: "#d7691e"
        highlight: rgba(215, 105, 30, 0.10)
        textHighlight: "#d7691e"
      darkMode:
        light: "#f5f5f5"
        lightgray: "#e8e8e8"
        gray: "#a0a0a0"
        darkgray: "#141414"
        dark: "#141414"
        secondary: "#d7691e"
        tertiary: "#d7691e"
        highlight: rgba(215, 105, 30, 0.10)
        textHighlight: "#d7691e"

plugins:
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5

  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30

  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    options:
      linkHeadings: false
    order: 40

  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
      openLinksInNewTab: true
      externalLinkIcon: false
    order: 60

  - source: "@quartz-community/description"
    enabled: true
    order: 70


  - source: "@quartz-community/remove-draft"
    enabled: true

  - source: "@quartz-community/alias-redirects"
    enabled: true

  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: false

  - source: "@quartz-community/content-page"
    enabled: true

layout:
  byPageType:
    content:
      template: portfolio
      positions:
        beforeBody: []
        left: []
        right: []
    "404":
      template: portfolio
      positions:
        beforeBody: []
        left: []
        right: []
